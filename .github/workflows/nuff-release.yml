# Publishes the nuff wheels a consuming repository pins. Fonno's pyproject.toml names each wheel's URL and
# its uv.lock holds each one's sha256, so `uv sync` refuses a rebuilt or tampered wheel. Releases are
# immutable for that reason: a fix ships as the next version, never as a re-upload.
name: nuff release

on:
  push:
    tags: ["nuff-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. nuff-0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag, the crate and the wheel name one version
        id: check
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#nuff-}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/nuff/Cargo.toml | head -1)
          wheel=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/nuff/pyproject.toml | head -1)
          if [ "$version" != "$crate" ] || [ "$version" != "$wheel" ]; then
            echo "::error::Tag $TAG, crates/nuff/Cargo.toml $crate, crates/nuff/pyproject.toml $wheel."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
            # jemalloc bakes in the build machine's page size; 64 KiB pages run on every aarch64 kernel.
            docker-options: -e JEMALLOC_SYS_WITH_LG_PAGE=16
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          docker-options: ${{ matrix.docker-options }}
          args: --release --locked --out dist --manifest-path crates/nuff/Cargo.toml
      - name: The wheel installs and reports its version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 -m venv /tmp/nuff
          /tmp/nuff/bin/pip install --quiet dist/*.whl
          reported=$(/tmp/nuff/bin/nuff --version)
          if [ "$reported" != "nuff $VERSION" ]; then
            echo "::error::The wheel reports '$reported', expected 'nuff $VERSION'."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: nuff-${{ needs.version.outputs.version }}
        run: |
          for wheel in *.whl; do sha256sum "$wheel" | cut -d' ' -f1 > "$wheel.sha256"; done
          gh release create "$TAG" --repo "${{ github.repository }}" --verify-tag --title "$TAG" \
            --notes "nuff wheels for macOS arm64 and Linux x86_64/aarch64. A consumer pins each wheel's URL and sha256." \
            *.whl *.whl.sha256
