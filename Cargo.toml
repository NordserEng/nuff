[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
# Please update rustfmt.toml when bumping the Rust edition
edition = "2024"
rust-version = "1.97"
homepage = "https://docs.astral.sh/ruff"
repository = "https://github.com/NordserEng/nuff"
authors = ["Charlie Marsh <charlie.r.marsh@gmail.com>"]
license = "MIT"

[workspace.dependencies]
char_str = { version = "0.0.4", default-features = false, features = ["std"] }
ruff_annotate_snippets = { version = "0.0.16", path = "crates/ruff_annotate_snippets" }
ruff_cache = { version = "0.0.16", path = "crates/ruff_cache" }
ruff_command_line = { version = "0.0.16", path = "crates/ruff_command_line" }
ruff_db = { version = "0.0.16", path = "crates/ruff_db", default-features = false }
ruff_diagnostics = { version = "0.0.16", path = "crates/ruff_diagnostics" }
ruff_index = { version = "0.0.16", path = "crates/ruff_index" }
ruff_linter = { version = "0.16.10", path = "crates/ruff_linter" }
ruff_macros = { version = "0.0.16", path = "crates/ruff_macros" }
ruff_memory_usage = { version = "0.0.16", path = "crates/ruff_memory_usage" }
ruff_notebook = { version = "0.0.16", path = "crates/ruff_notebook" }
ruff_options_metadata = { version = "0.0.16", path = "crates/ruff_options_metadata" }
ruff_python_ast = { version = "0.0.16", path = "crates/ruff_python_ast" }
ruff_python_codegen = { version = "0.0.16", path = "crates/ruff_python_codegen" }
ruff_python_edits = { version = "0.0.16", path = "crates/ruff_python_edits" }
ruff_python_importer = { version = "0.0.16", path = "crates/ruff_python_importer" }
ruff_python_index = { version = "0.0.16", path = "crates/ruff_python_index" }
ruff_python_literal = { version = "0.0.16", path = "crates/ruff_python_literal" }
ruff_python_parser = { version = "0.0.16", path = "crates/ruff_python_parser" }
ruff_python_semantic = { version = "0.0.16", path = "crates/ruff_python_semantic" }
ruff_python_stdlib = { version = "0.0.16", path = "crates/ruff_python_stdlib" }
ruff_python_trivia = { version = "0.0.16", path = "crates/ruff_python_trivia" }
ruff_source_file = { version = "0.0.16", path = "crates/ruff_source_file" }
ruff_ranged_value = { version = "0.0.16", path = "crates/ruff_ranged_value" }
ruff_text_size = { version = "0.0.16", path = "crates/ruff_text_size" }
ruff_workspace = { version = "0.0.16", path = "crates/ruff_workspace" }

ty_static = { version = "0.0.16", path = "crates/ty_static" }


aho-corasick = { version = "1.1.3", default-features = false, features = ["perf-literal", "std"] }
arrayvec = { version = "0.7.6", default-features = false }
anstream = { version = "1.0.0", default-features = false, features = ["auto", "wincon"] }
anstyle = { version = "1.0.10", default-features = false, features = ["std"] }
anyhow = { version = "1.0.80", default-features = false, features = ["std"] }
arc-swap = { version = "1.7.1", default-features = false }
argfile = { version = "1.0.0", default-features = false }
assert_fs = { version = "1.1.0", default-features = false }
rkyv = { version = "0.8.16", default-features = false, features = ["bytecheck", "std"] }
bitflags = { version = "2.5.0", default-features = false }
bstr = { version = "1.9.1", default-features = false, features = ["std"] }
cachedir = { version = "0.3.1", default-features = false }
camino = { version = "1.1.7", default-features = false }
