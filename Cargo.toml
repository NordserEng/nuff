clearscreen = { version = "4.0.0", default-features = false }
colored = { version = "3.0.0", default-features = false }
compact_str = { version = "0.10.0", default-features = false, features = ["std"] }
countme = { version = "3.0.1", default-features = false }
crossbeam = { version = "0.8.4", default-features = false, features = ["std"] }
dashmap = { version = "6.0.1", default-features = false }
datatest-stable = { version = "0.3.3", default-features = false }
drop_bomb = { version = "0.1.5", default-features = false }
dunce = { version = "1.0.5", default-features = false }
etcetera = { version = "0.11.0", default-features = false }
fern = { version = "0.7.0", default-features = false }
