[package]
name = "nuff"
version = "0.2.0"
description = "Nordser's ruff: upstream ruff plus Nordser's house rules"
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = "https://github.com/NordserEng/ruff"
license = { workspace = true }

[[bin]]
name = "nuff"
path = "src/main.rs"

[dependencies]
ruff = { workspace = true }
ruff_command_line = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env", "wrap_help"] }
colored = { workspace = true }
wild = { workspace = true }

[target.'cfg(all(not(target_os = "windows"), not(target_os = "openbsd"), not(target_os = "aix"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64", target_arch = "riscv64")))'.dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = { workspace = true }

[lints]
workspace = true
