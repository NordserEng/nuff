[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/NordserEng/nuff"
authors = ["Nordser"]
license = "MIT"

[workspace.dependencies]
char_str = { version = "0.0.4", default-features = false, features = ["std"] }
nuff_annotate_snippets = { path = "crates/nuff_annotate_snippets" }
nuff_cache = { path = "crates/nuff_cache" }
nuff_command_line = { path = "crates/nuff_command_line" }
nuff_diagnostics = { path = "crates/nuff_diagnostics" }
nuff_index = { path = "crates/nuff_index" }
nuff_linter = { path = "crates/nuff_linter" }
nuff_macros = { path = "crates/nuff_macros" }
nuff_notebook = { path = "crates/nuff_notebook" }
nuff_options_metadata = { path = "crates/nuff_options_metadata" }
nuff_python_ast = { path = "crates/nuff_python_ast" }
nuff_python_codegen = { path = "crates/nuff_python_codegen" }
nuff_python_importer = { path = "crates/nuff_python_importer" }
nuff_python_index = { path = "crates/nuff_python_index" }
nuff_python_literal = { path = "crates/nuff_python_literal" }
nuff_python_parser = { path = "crates/nuff_python_parser" }
nuff_python_semantic = { path = "crates/nuff_python_semantic" }
nuff_python_stdlib = { path = "crates/nuff_python_stdlib" }
nuff_python_trivia = { path = "crates/nuff_python_trivia" }
nuff_source_file = { path = "crates/nuff_source_file" }
nuff_text_size = { path = "crates/nuff_text_size" }
nuff_workspace = { path = "crates/nuff_workspace" }

aho-corasick = { version = "1.1.3", default-features = false, features = ["perf-literal", "std"] }
arrayvec = { version = "0.7.6", default-features = false }
anstream = { version = "1.0.0", default-features = false, features = ["auto", "wincon"] }
anstyle = { version = "1.0.10", default-features = false, features = ["std"] }
anyhow = { version = "1.0.80", default-features = false, features = ["std"] }
argfile = { version = "1.0.0", default-features = false }
rkyv = { version = "0.8.16", default-features = false, features = ["bytecheck", "std"] }
bitflags = { version = "2.5.0", default-features = false }
bstr = { version = "1.9.1", default-features = false, features = ["std"] }
cachedir = { version = "0.3.1", default-features = false }
clap = { version = "4.5.3", default-features = false, features = [
    "color",
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
colored = { version = "3.0.0", default-features = false }
compact_str = { version = "0.10.0", default-features = false, features = ["std"] }
drop_bomb = { version = "0.1.5", default-features = false }
etcetera = { version = "0.11.0", default-features = false }
fern = { version = "0.7.0", default-features = false }
filetime = { version = "0.2.23", default-features = false }
glob = { version = "0.3.1", default-features = false }
globset = { version = "0.4.14", default-features = false, features = ["log"] }
hashbrown = { version = "0.17.0", default-features = false, features = [
    "inline-more",
] }
heck = { version = "0.5.0", default-features = false }
icu_properties = { version = "2.1.2", default-features = false, features = ["compiled_data"] }
ignore = { version = "0.4.30", default-features = false }
indexmap = { version = "2.6.0", default-features = false, features = ["std"] }
insta = { version = "1.35.1", default-features = false, features = ["colors"] }
is-macro = { version = "0.3.5", default-features = false }
itertools = { version = "0.15.0", default-features = false, features = ["use_std"] }
jiff = { version = "0.2.0", default-features = false, features = [
    "perf-inline",
    "std",
    "tz-fat",
    "tz-system",
    "tzdb-bundle-platform",
    "tzdb-concatenated",
    "tzdb-zoneinfo",
] }
libcst = { version = "1.9.0", default-features = false }
log = { version = "0.4.17", default-features = false }
matchit = { version = "0.9.0", default-features = false }
memchr = { version = "2.7.1", default-features = false, features = ["std"] }
# mimalloc v3.3.2 crashes on Windows CPUs that do not support POPCNT.
# Fixed in mimalloc v3.4.0: https://github.com/microsoft/mimalloc/issues/1291
# Keep v2 until an updated Rust crate includes the fix.
path-absolutize = { version = "4.0.0", default-features = false }
path-slash = { version = "0.2.1", default-features = false }
pathdiff = { version = "0.2.1", default-features = false }
pep440_rs = { version = "0.7.1", default-features = false }
proc-macro2 = { version = "1.0.79", default-features = false, features = ["proc-macro"] }
quick-junit = { version = "0.6.0", default-features = false }
quote = { version = "1.0.23", default-features = false, features = ["proc-macro"] }
rand = { version = "0.10.0", default-features = false, features = ["std_rng"] }
rayon = { version = "1.10.0", default-features = false }
regex = { version = "1.10.2", default-features = false, features = ["perf", "std", "unicode"] }
rustc-hash = { version = "2.0.0", default-features = false, features = ["std"] }
seahash = { version = "4.1.0", default-features = false }
serde = { version = "1.0.197", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.113", default-features = false, features = ["std"] }
serde_test = { version = "1.0.152", default-features = false }
shellexpand = { version = "3.0.0", default-features = false, features = ["base-0", "tilde"] }
similar = { version = "3.0.0", default-features = false, features = ["inline", "std", "text"] }
smallvec = { version = "1.13.2", default-features = false, features = ["union", "const_generics", "const_new"] }
snapbox = { version = "1.0.0", default-features = false, features = [
    "color-auto",
    "diff",
    "term-svg",
    "cmd",
    "examples",
] }
static_assertions = { version = "1.1.0", default-features = false }
stacker = { version = "0.1.24", default-features = false }
strum = { version = "0.28.0", default-features = false, features = ["std", "strum_macros"] }
strum_macros = { version = "0.28.0", default-features = false }
supports-hyperlinks = { version = "3.1.0", default-features = false }
syn = { version = "3.0.0", default-features = false, features = [
    "clone-impls",
    "derive",
    "parsing",
    "printing",
    "proc-macro",
] }
tempfile = { version = "3.9.0", default-features = false, features = ["getrandom"] }
test-case = { version = "3.3.1", default-features = false }
thiserror = { version = "2.0.0", default-features = false, features = ["std"] }
thin-vec = { version = "0.2.14", default-features = false, features = ["std"] }
tikv-jemallocator = { version = "0.6.0", default-features = false, features = ["background_threads_runtime_support"] }
toml = { version = "1.0.0", default-features = false, features = ["display", "parse", "serde", "std"] }
typed-arena = { version = "2.0.2", default-features = false, features = ["std"] }
unicode-ident = { version = "1.0.12", default-features = false }
unicode-normalization = { version = "0.1.23", default-features = false, features = ["std"] }
unicode-width = { version = "0.2.0", default-features = false }
unicode_names2 = { version = "1.2.2", default-features = false }
url = { version = "2.5.0", default-features = false, features = ["std"] }
uuid = { version = "1.6.1", default-features = false, features = ["std"] }
wild = { version = "2", default-features = false }

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
# Allowed pedantic lints
assert_is_empty = "allow"
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Our formatting macros share names with std macros but use square brackets.
nonstandard_macro_braces = "allow"
similar_names = "allow"
single_match_else = "allow"
too_many_lines = "allow"
collapsible_match = "allow"  # Not always an improvement in readability, quite opinionated
needless_continue = "allow" # An explicit continue can be more readable, especially if the alternative is an empty block.
unnecessary_debug_formatting = "allow" # too many instances, the display also doesn't quote the path which is often desired in logs where we use them the most often.
# Without the hashes we run into a `rustfmt` bug in some snapshot tests, see #13250
needless_raw_string_hashes = "allow"
# Disallowed restriction lints
ignore_without_reason = "allow" # Too many existing instances, and there's no auto fix.
iter_over_hash_type = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
# nursery rules
redundant_clone = "warn"
debug_assert_with_mut_call = "warn"
unused_peekable = "warn"
# This lint sometimes flags code whose `if` and `else`
# bodies could be flipped when a `!` operator is removed.
# While perhaps sometimes a good idea, it is also often
# not a good idea due to other factors impacting
# readability. For example, if flipping the bodies results
# in the `if` being an order of magnitude bigger than the
# `else`, then some might consider that harder to read.
if_not_else = "allow"

[profile.release]
lto = "fat"
codegen-units = 16

# Some crates don't change as much but benefit more from
# more expensive optimization passes, so we selectively
# decrease codegen-units in some cases.
[profile.release.package.nuff_python_parser]
codegen-units = 1
[profile.release.package.nuff_python_ast]
codegen-units = 1

[profile.dev]
opt-level = 1
debug = "line-tables-only"
# Avoid the local ThinLTO that Cargo enables at nonzero optimization levels.
lto = "off"

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

