[package]
name = "nuff"
version = { workspace = true }
description = "Nordser's Python linter"
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[[bin]]
name = "nuff"
path = "src/main.rs"

[lib]
doctest = false

[dependencies]
nuff_cache = { workspace = true }
nuff_command_line = { workspace = true }
nuff_diagnostics = { workspace = true }
nuff_linter = { workspace = true, features = ["clap"] }
nuff_macros = { workspace = true }
nuff_notebook = { workspace = true }
nuff_options_metadata = { workspace = true, features = ["serde"] }
nuff_python_ast = { workspace = true }
nuff_source_file = { workspace = true }
nuff_text_size = { workspace = true }
nuff_workspace = { workspace = true }

anyhow = { workspace = true }
rkyv = { workspace = true }
bitflags = { workspace = true }
cachedir = { workspace = true }
clap = { workspace = true, features = ["derive", "env", "wrap_help"] }
colored = { workspace = true }
filetime = { workspace = true }
ignore = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
path-absolutize = { workspace = true, features = ["fixed_workdir"] }
rayon = { workspace = true }
regex = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
wild = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
tikv-jemallocator = { workspace = true }

[dev-dependencies]
colored = { workspace = true, features = ["no-color"] }
insta = { workspace = true, features = ["filters", "json"] }
test-case = { workspace = true }

[lints]
workspace = true
