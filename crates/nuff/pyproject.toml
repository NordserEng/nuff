[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "nuff"
version = "0.1.0"
description = "Nordser's ruff: upstream ruff plus Nordser's house rules."
requires-python = ">=3.7"
license = "MIT"

[project.urls]
Repository = "https://github.com/NordserEng/ruff"

[tool.maturin]
bindings = "bin"
strip = true
