regex-syntax = { version = "0.8.8", default-features = false }
rustc-hash = { version = "2.0.0", default-features = false, features = ["std"] }
# When updating salsa, make sure to also update the version in `fuzz/Cargo.toml`
salsa = { version = "0.28.5", default-features = false, features = [
    "compact_str",
    "macros",
    "salsa_unstable",
    "inventory",
] }
same-file = { version = "1.0.6", default-features = false }
schemars = { version = "1.0.4", default-features = false, features = ["derive", "std"] }
seahash = { version = "4.1.0", default-features = false }
serde = { version = "1.0.197", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.113", default-features = false, features = ["std"] }
serde_test = { version = "1.0.152", default-features = false }
shellexpand = { version = "3.0.0", default-features = false, features = ["base-0", "tilde"] }
similar = { version = "3.0.0", default-features = false, features = ["inline", "std", "text"] }
smallvec = { version = "1.13.2", default-features = false, features = ["union", "const_generics", "const_new"] }
snapbox = { version = "1.0.0", default-features = false, features = [
    "color-auto",
    "diff",
    "term-svg",
    "cmd",
    "examples",
] }
static_assertions = { version = "1.1.0", default-features = false }
stacker = { version = "0.1.24", default-features = false }
strum = { version = "0.28.0", default-features = false, features = ["std", "strum_macros"] }
strum_macros = { version = "0.28.0", default-features = false }
supports-hyperlinks = { version = "3.1.0", default-features = false }
syn = { version = "3.0.0", default-features = false, features = [
    "clone-impls",
    "derive",
    "parsing",
    "printing",
    "proc-macro",
] }
tempfile = { version = "3.9.0", default-features = false, features = ["getrandom"] }
test-case = { version = "3.3.1", default-features = false }
thiserror = { version = "2.0.0", default-features = false, features = ["std"] }
thin-vec = { version = "0.2.14", default-features = false, features = ["std"] }
tikv-jemallocator = { version = "0.6.0", default-features = false, features = ["background_threads_runtime_support"] }
toml = { version = "1.0.0", default-features = false, features = ["display", "parse", "serde", "std"] }
tracing = { version = "0.1.40", default-features = false, features = ["attributes", "std"] }
tracing-log = { version = "0.2.0", default-features = false, features = ["log-tracer", "std"] }
tracing-subscriber = { version = "0.3.18", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
    "smallvec",
] }
typed-arena = { version = "2.0.2", default-features = false, features = ["std"] }
unicode-ident = { version = "1.0.12", default-features = false }
unicode-normalization = { version = "0.1.23", default-features = false, features = ["std"] }
unicode-width = { version = "0.2.0", default-features = false }
unicode_names2 = { version = "1.2.2", default-features = false }
url = { version = "2.5.0", default-features = false, features = ["std"] }
uuid = { version = "1.6.1", default-features = false, features = ["std"] }
walkdir = { version = "2.3.2", default-features = false }
which = { version = "8.0.0", default-features = false, features = ["real-sys"] }
wild = { version = "2", default-features = false }
zip = { version = "8.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
# Enabled at the crate level
disallowed_methods = "allow"
# Allowed pedantic lints
assert_is_empty = "allow"
char_lit_as_u8 = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
implicit_hasher = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Our formatting macros share names with std macros but use square brackets.
nonstandard_macro_braces = "allow"
similar_names = "allow"
single_match_else = "allow"
too_many_lines = "allow"
collapsible_match = "allow"  # Not always an improvement in readability, quite opinionated
needless_continue = "allow" # An explicit continue can be more readable, especially if the alternative is an empty block.
unnecessary_debug_formatting = "allow" # too many instances, the display also doesn't quote the path which is often desired in logs where we use them the most often.
# Without the hashes we run into a `rustfmt` bug in some snapshot tests, see #13250
needless_raw_string_hashes = "allow"
# Disallowed restriction lints
ignore_without_reason = "allow" # Too many existing instances, and there's no auto fix.
iter_over_hash_type = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
# nursery rules
redundant_clone = "warn"
debug_assert_with_mut_call = "warn"
unused_peekable = "warn"
# This lint sometimes flags code whose `if` and `else`
# bodies could be flipped when a `!` operator is removed.
# While perhaps sometimes a good idea, it is also often
# not a good idea due to other factors impacting
# readability. For example, if flipping the bodies results
# in the `if` being an order of magnitude bigger than the
# `else`, then some might consider that harder to read.
if_not_else = "allow"

[profile.release]
lto = "fat"
codegen-units = 16

# Some crates don't change as much but benefit more from
# more expensive optimization passes, so we selectively
# decrease codegen-units in some cases.
[profile.release.package.ruff_python_parser]
codegen-units = 1
[profile.release.package.ruff_python_ast]
codegen-units = 1
[profile.release.package.salsa]
codegen-units = 1

[profile.dev]
opt-level = 1
debug = "line-tables-only"
# Avoid the local ThinLTO that Cargo enables at nonzero optimization levels.
lto = "off"

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[profile.dev.package.salsa]
opt-level = 3
