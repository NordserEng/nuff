natord = { version = "1.0.9", default-features = false }
notify = { version = "8.0.0", default-features = false, features = ["macos_fsevent"] }
ordermap = { version = "1.0.0", default-features = false, features = ["std"] }
path-absolutize = { version = "4.0.0", default-features = false }
path-slash = { version = "0.2.1", default-features = false }
pathdiff = { version = "0.2.1", default-features = false }
pep440_rs = { version = "0.7.1", default-features = false }
proc-macro2 = { version = "1.0.79", default-features = false, features = ["proc-macro"] }
pyproject-toml = { version = "0.13.4", default-features = false }
quick-junit = { version = "0.6.0", default-features = false }
quote = { version = "1.0.23", default-features = false, features = ["proc-macro"] }
rand = { version = "0.10.0", default-features = false, features = ["std_rng"] }
